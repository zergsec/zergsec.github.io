# ============================================================
#  zergsec 的博客 —— Hugo 站点配置（PaperMod 主题）
#  改站点地址 / 标题 / 简介，都在这个文件里改。
# ============================================================

# 站点根地址：用户站点的形式固定为 https://<GitHub 用户名>.github.io/
# 以后改了 GitHub 用户名，把这里改成新名字，仓库也要一起改名。
baseURL: "https://zergsec.github.io/"

title: "zergsec 的博客"
locale: "zh-CN"
defaultContentLanguage: "zh"
hasCJKLanguage: true
theme: "PaperMod"

# 分页：每页文章数（Hugo 0.128+ 的新写法）
pagination:
  pagerSize: 10

enableRobotsTXT: true
buildDrafts: false
buildFuture: false
buildExpired: false
enableEmoji: true

minify:
  disableXML: true
  minifyOutput: true

# 首页除了 HTML 和 RSS，还要输出 JSON 供站内搜索使用
outputs:
  home:
    - HTML
    - RSS
    - JSON

params:
  env: production
  title: "zergsec 的博客"
  description: "记录学习、折腾与踩坑"
  keywords: [博客, 笔记, 折腾]
  author: "zergsec"

  DateFormat: "2006-01-02"
  defaultTheme: auto          # auto / light / dark：默认跟随系统
  disableThemeToggle: false   # 是否隐藏明暗切换按钮

  ShowReadingTime: true       # 显示阅读时长
  ShowWordCount: true         # 显示字数
  ShowShareButtons: false     # 文章底部分享按钮
  ShowPostNavLinks: true      # 上一篇 / 下一篇
  ShowBreadCrumbs: true       # 面包屑
  ShowCodeCopyButtons: true   # 代码块复制按钮
  ShowRssButtonInSectionTermList: true
  UseHugoToc: true            # 用 Hugo 内置目录
  disableSpecial1stPost: false
  disableScrollToTop: false
  comments: false
  hidemeta: false
  hideSummary: false
  showtoc: false              # 文章默认不展开目录（可在单篇文章里单独开启）
  tocopen: false

  assets:
    favicon: "/favicon.ico"

  # 首页开屏动画：头像弹出 → 自我介绍逐字出现 → 自动进入主页
  # 想关掉就把 enabled 改成 false
  intro:
    enabled: true
    avatar: "/images/avatar.jpg"
    name: "zergsec"
    message: "一名普通的pwn手"
    typingSpeed: 85         # 每个字的间隔（毫秒），数字越小打字越快
    holdAfterTyping: 900    # 打完字后停留多久再淡出（毫秒）
    fadeOut: 700            # 淡出时长（毫秒）
    oncePerSession: false   # true = 每个浏览器会话只播一次，false = 每次打开首页都播
    skipText: "跳过"

  # 独立的 profile 首页（大头像居中，但首页就没有文章列表了）
  # 参考站 uaooo / jixing2 用的是「卡片 + 文章列表」版式，即下面 homeInfoParams 那种，
  # 所以这里保持关闭
  profileMode:
    enabled: false
    title: "zergsec"
    subtitle: "一名普通的pwn手"      # 支持 Markdown，可以写链接和强调
    imageUrl: "/images/avatar.jpg"
    imageWidth: 150
    imageHeight: 150
    imageTitle: "头像"
    buttons:
      - name: 文章
        url: /posts/
      - name: 归档
        url: /archives/
      - name: 关于
        url: /about/

  # 首页个人卡片：大头像 + 名字 + 签名 + 胶囊按钮 + 「写在前面」，下面紧接文章列表
  # 版式与 uaooo / jixing2 一致（它们就是自定义了这个位置的模板）
  homeInfoParams:
    Title: "zergsec"                      # 名字（支持 Markdown）
    Content: "一名普通的pwn手"             # 一句话签名（支持 Markdown 链接）
    avatar: "/images/avatar.jpg"          # 头像
    links:                                # 头像下面的胶囊按钮，想加就往下加
      - name: GitHub
        url: "https://github.com/zergsec"
      - name: 查看文章
        url: "/posts/"
      - name: 关于我
        url: "/about/"
    aboutTitle: "写在前面"
    about: |
      欢迎来到我的博客。这里会记录逆向与 Pwn 的笔记、CTF 题解，以及折腾各种工具时踩过的坑。

      水平有限，写下来的东西难免有疏漏，欢迎到 GitHub 上开 issue 指正。
    quote: "知不足而后进，望山远而力行。"

  socialIcons:
    - name: github
      url: "https://github.com/zergsec"

  # 文章底部「建议修改」按钮指向 GitHub 编辑页
  editPost:
    URL: "https://github.com/zergsec/zergsec.github.io/edit/main/content"
    Text: "在 GitHub 上编辑"
    appendFilePath: true

  # 站内搜索参数（PaperMod 用 fuse.js 做模糊匹配）
  fuseOpts:
    isCaseSensitive: false
    shouldSort: true
    location: 0
    distance: 1000
    threshold: 0.4
    minMatchCharLength: 0
    keys: ["title", "permalink", "summary", "content"]

  cover:
    hiddenInList: true        # 列表页不显示封面图
    hiddenInSingle: false     # 文章页显示封面图

markup:
  goldmark:
    renderer:
      unsafe: true            # 允许在 Markdown 里直接写 HTML
  highlight:
    noClasses: false
    lineNos: false
    codeFences: true

menu:
  main:
    - identifier: posts
      name: 文章
      url: /posts/
      weight: 10
    - identifier: archives
      name: 归档
      url: /archives/
      weight: 20
    - identifier: tags
      name: 标签
      url: /tags/
      weight: 30
    - identifier: search
      name: 搜索
      url: /search/
      weight: 40
    - identifier: about
      name: 关于
      url: /about/
      weight: 50
